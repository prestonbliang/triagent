[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triagent"
version = "0.1.0"
description = "An AI vulnerability-triage analyst: retrieval, multi-agent orchestration, defensible CVSS scoring, and an eval harness for bug-bounty and security teams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cris" }]
keywords = ["security", "cvss", "rag", "langgraph", "llm-eval", "vulnerability-triage"]

# Core runtime deps kept lean so the graph + evals run offline in CI.
# Heavy/prod-only deps (sentence-transformers, psycopg, real LLM SDKs) live in
# optional extras and are lazy-imported, so `pip install -e .` + pytest is fast.
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langgraph>=0.2.28",
    "langchain-core>=0.3.0",
    "numpy>=1.26",
    "httpx>=0.27",
    "tenacity>=8.2",
    "structlog>=24.1",
]

[project.optional-dependencies]
# Production embedding + reranking models.
models = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
# Postgres + pgvector store.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3.0",
]
# Real LLM providers (choose one at runtime via TRIAGENT_LLM_PROVIDER).
llm = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
]
# API service.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
# Observability (LLMOps tracing).
obs = [
    "langfuse>=2.50",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
triagent-eval = "triagent.eval.run:main"
triagent-ingest = "triagent.ingest.nvd:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",    # FastAPI Depends() in defaults
    "SIM108",  # forced ternaries hurt readability on multi-term math (CVSS impact)
    "UP042",   # keep str+Enum for pydantic v2 value semantics on py3.11
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
